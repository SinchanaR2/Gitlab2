<!-- Language: HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Page</title>
</head>
<body>
    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph -->
    <p>This is my first web page. I am learning HTML!</p>

    <!-- Link -->
    <p>Visit <a href="https://www.example.com" target="_blank">Example Site</a> for more info.</p>

    <!-- Ordered List -->
    <h2>My To-Do List</h2>
    <ol>
        <li>Learn HTML</li>
        <li>Practice CSS</li>
        <li>Build a web project</li>
    </ol>

    <!-- Unordered List -->
    <h2>My Interests</h2>
    <ul>
        <li>Programming</li>
        <li>Reading</li>
        <li>Music</li>
    </ul>

    <!-- Image Example -->
    <h2>My Favorite Image</h2>
    <img src="https://via.placeholder.com/150" alt="Sample Image">

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My First Website</p>
    </footer>
</body>
</html>
